# HELIOS COMMAND — nginx config for serving the SPA.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy the API under the SAME origin as the SPA. This lets the
    # frontend call the backend at "/api/..." (same-origin), avoiding
    # cross-origin CORS/cookie issues and, in tunnel setups, a second
    # interstitial. In production the backend is reachable as "backend:8000"
    # on the shared Docker network.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing: unknown paths return index.html (SPA fallback).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic hardening headers. HTTPS/HSTS is terminated at the reverse proxy in
    # production; these are safe defaults for the static assets.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
