# HELIOS COMMAND — nginx config for serving the SPA.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing: unknown paths return index.html (SPA fallback).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic hardening headers. HTTPS/HSTS is terminated at the reverse proxy in
    # production; these are safe defaults for the static assets.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
