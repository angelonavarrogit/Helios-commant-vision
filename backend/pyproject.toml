[project]
name = "ai-personal-intelligence"
version = "0.1.0"
description = "AI Personal Intelligence Center — email ingestion, analysis and Telegram alerts."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle, I: isort, B: bugbear, UP: pyupgrade,
# S: bandit-style security, ASYNC: async pitfalls
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Assertions and test-only fake secrets are expected in tests.
"tests/*" = ["S101", "S105", "S106", "S107"]
# Auto-generated Alembic migrations follow the tool's own style.
"alembic/versions/*" = ["E501", "I001", "UP"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "alembic/versions/"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true
files = ["app"]

# Third-party Google client libraries ship no type stubs; ignore only their
# missing imports rather than relaxing type checking globally.
[[tool.mypy.overrides]]
module = [
    "googleapiclient.*",
    "google.*",
    "google_auth_oauthlib.*",
    "openai.*",
    "pypdf.*",
    "openpyxl.*",
    "docx.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
